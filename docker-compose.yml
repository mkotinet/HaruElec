version: "3.8"

services:
  haruelec:
    image: node:20-alpine
    container_name: haruelec
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - haruelec_data:/app/data
    environment:
      - PORT=80
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    command: >
      /bin/sh -c "
        apk add --no-cache git &&
        git config --global user.name 'mkotinet' &&
        git config --global user.email 'mkotinet@users.noreply.github.com' &&
        rm -rf /app_src &&
        if [ -n \"$$GITHUB_TOKEN\" ]; then
          git clone https://mkotinet:$${GITHUB_TOKEN}@github.com/mkotinet/HaruElec.git /app_src
        else
          git clone https://github.com/mkotinet/HaruElec.git /app_src
        fi &&
        cd /app_src &&
        node server.js
      "
    networks:
      - npm_default

volumes:
  haruelec_data:

networks:
  npm_default:
    external: true
